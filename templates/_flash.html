{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-stack">
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat if cat != 'message' else 'info' }} alert-dismissible fade show" role="alert">
      <i class="bi {{ {'success':'bi-check-circle','danger':'bi-exclamation-octagon','warning':'bi-exclamation-triangle'}.get(cat, 'bi-info-circle') }} me-2"></i>{{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
